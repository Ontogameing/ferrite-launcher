name: Build Ferrite Launcher

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Format, Clippy, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets

      - name: test
        run: cargo test --all-targets

  build:
    name: Release build (${{ matrix.os }})
    needs: check
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      # Rename binaries so upload-artifact names match softprops/action-gh-release paths.
      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: cp target/release/ferrite-launcher ferrite-launcher-linux

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/ferrite-launcher.exe ferrite-launcher-windows.exe

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: cp target/release/ferrite-launcher ferrite-launcher-macos

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-launcher-linux
          path: ferrite-launcher-linux

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-launcher-windows
          path: ferrite-launcher-windows.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-launcher-macos
          path: ferrite-launcher-macos

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/ferrite-launcher-linux/ferrite-launcher-linux
            artifacts/ferrite-launcher-windows/ferrite-launcher-windows.exe
            artifacts/ferrite-launcher-macos/ferrite-launcher-macos
