[package]
name = "ferrite-launcher"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Ontogameing/ferrite-launcher"
description = "A lightweight, customizable Minecraft launcher written in Rust"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:image", "dep:rfd"]

[[bin]]
name = "ferrite-launcher"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.36.1", optional = true }
egui = { version = "0.36.1", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.7"
sha2 = "0.10.9"
hex = "0.4.3"
zip = "0.6"
discord-rich-presence = "1.1.0"
directories = "6.0"
toml = "0.8"
rfd = { version = "0.15", optional = true }
semver = "1"
# Moves deleted instances to the OS trash (Recycle Bin / Trash / freedesktop trash).
# Default features: COM apartment-threaded init on Windows (Ferrite calls it on a
# dedicated thread) and DeletionDate in freedesktop .trashinfo files.
trash = "5.2.9"
# NFC-normalizes instance names and folder names before case-insensitive comparison
# (macOS stores decomposed file names; users type composed ones).
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
