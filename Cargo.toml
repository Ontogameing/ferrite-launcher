[package]
name = "ferrite-launcher"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Ontogameing/ferrite-launcher"
description = "A lightweight, customizable Minecraft launcher written in Rust"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.7"
sha2 = "0.10.9"
hex = "0.4.3"
zip = "0.6"
discord-rich-presence = "1.1.0"
directories = "6.0"
toml = "0.8"
rfd = "0.15"
semver = "1"
